[package]
name = "numbat-ui"
description = "A native GUI for the Numbat scientific calculator."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
numbat-ui-core.workspace = true
# The desktop build keeps numbat's default features: live exchange rates and
# plotting. The web build leaves both off (see `crates/web`).
numbat = { workspace = true, features = ["fetch-exchangerates", "plotting"] }
serde.workspace = true
log.workspace = true
eframe = { version = "0.34", features = ["persistence"] }
egui = "0.34"
env_logger = "0.11"
global-hotkey = "0.8"
image = { version = "0.25", features = ["png"] }
dirs = "5.0"
toml = "1.0.6"
ron = "0.8"
auto-launch = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.17"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSImage", "NSWindow", "NSScreen", "NSEvent", "NSGraphics", "NSPasteboard"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSNotification", "NSOperation", "NSArray", "NSString", "NSEnumerator", "NSGeometry", "NSAppleEventManager", "NSAppleEventDescriptor", "objc2-core-services", "block2"] }

[dev-dependencies]
serde_json = "1.0.149"

[build-dependencies]
toml = "1.0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "Numbat"
identifier = "com.fabio.numbat-ui"
icon = ["src/icons/icon.icns"]
