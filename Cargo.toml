[workspace]
members = ["crates/core", "crates/desktop", "crates/web"]
# The web crate only builds for wasm32, so keep it out of the default
# `cargo build` / `cargo test` set. Build it explicitly:
#   cargo build -p numbat-ui-web --target wasm32-unknown-unknown
default-members = ["crates/core", "crates/desktop"]
resolver = "2"

[workspace.package]
version = "3.2.0"
authors = ["Fabio Manz"]
edition = "2021"
license = "MIT"

[workspace.dependencies]
# The single place the numbat version is declared. `build.rs` reads it from
# here to export NUMBAT_VERSION, and the version check test asserts it is
# the latest release on crates.io.
numbat = { version = "1.23.0", default-features = false }
numbat-ui-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
log = "0.4"

# The web build trades compile time for a smaller download; the desktop
# release profile is left alone.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
