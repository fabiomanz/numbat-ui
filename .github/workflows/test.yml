name: Test
on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Check Rust
        run: cargo check --verbose

      - name: Run Tests
        run: cargo test --verbose

      # The web crate is not in the workspace's default members (it only
      # builds for wasm), so it needs checking explicitly or it silently rots.
      - name: Check the web crate
        run: cargo check -p numbat-ui-web --target wasm32-unknown-unknown --verbose

      - name: Test the web crate
        run: cargo test -p numbat-ui-web --verbose

      - name: Test the wasm boundary
        run: ./scripts/test-web.sh
